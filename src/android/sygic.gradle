android {
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation files("${project.projectDir}/libs/embedded-with-res-26.0.7-outsystems.aar")
}

// Configure Kotlin compilation without directly referencing Kotlin classes
tasks.configureEach { task ->
    if (task.name.startsWith("compile") && task.name.endsWith("Kotlin") ||
        task.name.startsWith("kaptGenerateStubs") && task.name.endsWith("Kotlin")) {

        task.kotlinOptions {
            freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
}
